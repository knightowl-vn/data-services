name: Setup Claude Code sandbox
description: >
  Install and verify the OS-level dependencies Claude Code's Bash sandbox
  needs on Linux (bubblewrap + socat), including the AppArmor profile that
  Ubuntu 24.04+ requires for bubblewrap to create user namespaces.

runs:
  using: composite
  steps:
    - name: Install bubblewrap and socat
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq bubblewrap socat

    - name: Allow bubblewrap to create user namespaces (Ubuntu 24.04+)
      shell: bash
      run: |
        if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = "1" ]; then
          sudo tee /etc/apparmor.d/bwrap > /dev/null <<'EOF'
        abi <abi/4.0>,
        include <tunables/global>

        profile bwrap /usr/bin/bwrap flags=(unconfined) {
          userns,
          include if exists <local/bwrap>
        }
        EOF
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
        fi

    - name: Verify bubblewrap works
      shell: bash
      run: bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all --die-with-parent true
