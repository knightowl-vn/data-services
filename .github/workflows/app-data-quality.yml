# Pipeline for apps/data-quality. Copy this file for a new app and change APP paths.
name: app-data-quality

on:
  push:
    branches: [main]
    paths: ["apps/data-quality/**", "libs/pulumi-components/**", ".github/workflows/app-data-quality.yml"]
  pull_request:
    branches: [main]
    paths: ["apps/data-quality/**", "libs/pulumi-components/**", ".github/workflows/app-data-quality.yml"]
  workflow_dispatch:

permissions: {contents: read}

jobs:
  # Work out which parts of the app changed, so only those run.
  changes:
    runs-on: ubuntu-24.04-arm
    permissions: {contents: read, pull-requests: read}
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
      infra: ${{ steps.f.outputs.infra }}
      deploy: ${{ steps.f.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            backend:  ["apps/data-quality/backend/**", "apps/data-quality/api/**"]
            frontend: ["apps/data-quality/frontend/**", "apps/data-quality/api/**"]
            infra:    ["apps/data-quality/infra/**", "libs/pulumi-components/**"]
            deploy:   ["apps/data-quality/deploy/**"]

  api-contract:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -e apps/data-quality/backend
      - name: openapi.json matches backend code
        run: make -C apps/data-quality api-check

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    permissions: {contents: read, packages: write}
    uses: ./.github/workflows/_build-python.yml
    with:
      path: apps/data-quality/backend
      image: ghcr.io/knightowl-vn/data-quality-backend
      push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    permissions: {contents: read, packages: write}
    uses: ./.github/workflows/_build-node.yml
    with:
      path: apps/data-quality/frontend
      image: ghcr.io/knightowl-vn/data-quality-frontend
      push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    permissions: {contents: read, pull-requests: write}
    uses: ./.github/workflows/_pulumi.yml
    with:
      path: apps/data-quality/infra
      stack: knightowl/data-quality/dev
      command: ${{ github.event_name == 'pull_request' && 'preview' || 'up' }}
    secrets:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

  # PRs: validate manifests only. main: also bump image tags for dev.
  # Staging/prod: promote by copying the tag in a PR (or add jobs with environments).
  deploy-dev:
    needs: [changes, backend, frontend, infra]
    if: >-
      always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      (needs.backend.result == 'success' || needs.frontend.result == 'success' ||
       needs.changes.outputs.deploy == 'true')
    permissions: {contents: write}
    uses: ./.github/workflows/_deploy.yml
    with:
      overlay: apps/data-quality/deploy/overlays/dev
      images: >-
        ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.backend.result == 'success' && format('ghcr.io/knightowl-vn/data-quality-backend:{0}', github.sha) || '' }}
        ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.frontend.result == 'success' && format('ghcr.io/knightowl-vn/data-quality-frontend:{0}', github.sha) || '' }}
