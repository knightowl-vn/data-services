# Reusable: lint + test a Python component; on main, build and push its image.
name: build-python

on:
  workflow_call:
    inputs:
      path: {type: string, required: true, description: "Component folder, e.g. apps/x/backend"}
      image: {type: string, required: true, description: "Image name without tag"}
      python-version: {type: string, default: "3.13"}
      push: {type: boolean, default: false}

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions: {contents: read, packages: write}
    defaults:
      run: {working-directory: "${{ inputs.path }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ inputs.python-version }}"}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

      - if: inputs.push
        uses: docker/setup-qemu-action@v3
      - if: inputs.push
        uses: docker/setup-buildx-action@v3
      - if: inputs.push
        uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - if: inputs.push
        uses: docker/build-push-action@v6
        with:
          context: "${{ inputs.path }}"
          platforms: linux/amd64,linux/arm64
          push: true
          tags: "${{ inputs.image }}:${{ github.sha }}"
