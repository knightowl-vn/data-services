# Reusable: test + build a Node component; on main, build and push its image.
name: build-node

on:
  workflow_call:
    inputs:
      path: {type: string, required: true}
      image: {type: string, required: true}
      node-version: {type: string, default: "22"}
      push: {type: boolean, default: false}

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions: {contents: read, packages: write}
    defaults:
      run: {working-directory: "${{ inputs.path }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.node-version }}"
          cache: npm
          cache-dependency-path: "${{ inputs.path }}/package-lock.json"
      - run: npm ci
      - run: npm test
      - run: npm run build

      - if: inputs.push
        uses: docker/setup-qemu-action@v3
      - if: inputs.push
        uses: docker/setup-buildx-action@v3
      - if: inputs.push
        uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - if: inputs.push
        uses: docker/build-push-action@v6
        with:
          context: "${{ inputs.path }}"
          platforms: linux/amd64,linux/arm64
          push: true
          tags: "${{ inputs.image }}:${{ github.sha }}"
