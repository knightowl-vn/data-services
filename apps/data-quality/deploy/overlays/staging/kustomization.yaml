apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: data-quality-staging   # created by infra/ (AppNamespace)
resources:
  - ../../base
replicas:
  - {name: data-quality-backend, count: 2}
  - {name: data-quality-frontend, count: 2}
# CI updates these tags after building; Argo CD syncs the change.
images:
  - name: ghcr.io/knightowl-vn/data-quality-backend
    newTag: latest
  - name: ghcr.io/knightowl-vn/data-quality-frontend
    newTag: latest
