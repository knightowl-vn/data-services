# Serves this product's portal remote. The portal shell proxies
# /apps/data-quality/* here with the prefix removed, so paths are:
#   /remoteEntry.js  /portal.json  /assets/*  /api/*
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # The api Service in the same namespace.
  location /api/ {
    proxy_pass http://data-quality-api:8000;
  }

  # Hashed file names: cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # remoteEntry.js, portal.json, index.html: always revalidate, so a deploy is
  # live on the next page load without touching the shell.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
