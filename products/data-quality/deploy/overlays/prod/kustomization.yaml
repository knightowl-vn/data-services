apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: data-quality-prod   # created by infra/ (AppNamespace)
resources:
  - ../../base
replicas:
  - {name: data-quality-api, count: 3}
  - {name: data-quality-web, count: 3}
# CI updates these tags after building; Argo CD syncs the change.
images:
  - name: ghcr.io/knightowl-vn/data-quality-api
    newTag: latest
  - name: ghcr.io/knightowl-vn/data-quality-web
    newTag: latest
patches:
  - target: {kind: Deployment, name: data-quality-api}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: https://auth.knightowl.vn/realms/knightowl
