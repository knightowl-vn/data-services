apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-quality-web
  labels: {app.kubernetes.io/name: data-quality, app.kubernetes.io/component: web}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: data-quality, app.kubernetes.io/component: web}
  template:
    metadata:
      labels: {app.kubernetes.io/name: data-quality, app.kubernetes.io/component: web}
    spec:
      serviceAccountName: data-quality
      securityContext: {runAsNonRoot: true}
      containers:
        - name: web
          image: ghcr.io/knightowl-vn/data-quality-web
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: data-quality-web
spec:
  selector: {app.kubernetes.io/name: data-quality, app.kubernetes.io/component: web}
  ports: [{port: 80, targetPort: 8080}]
