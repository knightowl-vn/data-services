apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-quality-api
  labels: {app.kubernetes.io/name: data-quality, app.kubernetes.io/component: api}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: data-quality, app.kubernetes.io/component: api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: data-quality, app.kubernetes.io/component: api}
    spec:
      serviceAccountName: data-quality   # created by AppNamespace (infra/)
      securityContext: {runAsNonRoot: true, runAsUser: 1000}
      containers:
        - name: api
          image: ghcr.io/knightowl-vn/data-quality-api
          ports: [{containerPort: 8000}]
          env:
            # Must match the portal's oauth2-proxy (platform/frontend/portal/infra/Pulumi.<env>.yaml):
            # it forwards that client's ID token, which the api verifies.
            - {name: OIDC_ISSUER_URL, value: https://auth.dev.knightowl.vn/realms/knightowl}   # set per overlay
            - {name: OIDC_AUDIENCE, value: portal}
          envFrom:
            - secretRef: {name: data-quality-db, optional: true}   # DATABASE_URL from PostgresTenant
          readinessProbe: {httpGet: {path: /health, port: 8000}}
          livenessProbe: {httpGet: {path: /health, port: 8000}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: data-quality-api
spec:
  selector: {app.kubernetes.io/name: data-quality, app.kubernetes.io/component: api}
  ports: [{port: 8000, targetPort: 8000}]
