apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-shell
  labels: {app.kubernetes.io/name: portal, app.kubernetes.io/component: shell}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: portal, app.kubernetes.io/component: shell}
  template:
    metadata:
      labels: {app.kubernetes.io/name: portal, app.kubernetes.io/component: shell}
    spec:
      serviceAccountName: portal   # created by AppNamespace (infra/)
      securityContext: {runAsNonRoot: true}
      containers:
        - name: shell
          image: ghcr.io/knightowl-vn/portal-shell
          ports: [{containerPort: 8080}]
          env:
            - {name: PORTAL_ENV, value: dev}   # set per overlay; picks <name>-<env> namespaces
            - {name: NGINX_RESOLVER, value: kube-dns.kube-system.svc.cluster.local}
          volumeMounts:
            - {name: remotes, mountPath: /etc/portal, readOnly: true}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
      volumes:
        - name: remotes
          configMap: {name: portal-remotes}   # from the overlay's remotes.json
---
apiVersion: v1
kind: Service
metadata:
  name: portal-shell
spec:
  selector: {app.kubernetes.io/name: portal, app.kubernetes.io/component: shell}
  ports: [{port: 80, targetPort: 8080}]
