apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portal-prod   # created by infra/ (AppNamespace)
resources:
  - ../../base
replicas:
  - {name: portal-shell, count: 2}
# Products in the portal in this env. Adding a product is one line here, once;
# after that the product changes its pages, nav and roles with its own deploys.
configMapGenerator:
  - name: portal-remotes
    files: [remotes.json]
patches:
  - target: {kind: Deployment, name: portal-shell}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: prod
# CI updates this tag after building; Argo CD syncs the change.
images:
  - name: ghcr.io/knightowl-vn/portal-shell
    newTag: latest
